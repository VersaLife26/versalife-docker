# Redis on a 4 GB VPS, inside a 192 MB container limit.
#
# requirepass is NOT here. It arrives on the command line from the compose
# file so the secret never lands in a file committed to this repo or written
# to the data volume.

bind 0.0.0.0
protected-mode yes
port 6379

maxmemory 128mb

# =============================================================================
# noeviction, and this is the most important line in the file
# =============================================================================
# Redis has no per-key eviction policy, so the policy is decided by the LEAST
# evictable key in the instance. Here is what actually lives in this Redis:
#
#   otp:code:*, otp:verify_attempts:*   OTP codes and the brute-force budget
#   ratelimit:<tier>:<key>              every rate limit on the platform
#   auth:suspended:<uuid>               the suspension denylist
#   lock:slot:<uuid>                    the lock that prevents double booking
#   signal:room:<name>                  the 2-peer cap on a consultation
#   waiting_room:doctor:<uuid>          a mirror of Postgres (rebuildable)
#   gw:cb:*                             circuit breaker state
#
# Six of those seven are security or correctness controls, and evicting any of
# them fails OPEN and SILENTLY: a bypassed rate limit, a reinstated suspended
# account, a double booking, a third party in a two-person consultation.
#
# noeviction fails CLOSED instead. A write to a full Redis returns an OOM
# error, the caller errors, and the request 5xxs loudly. That is the failure
# you want on a platform holding medical records.
#
# Every security key already carries a TTL, so the steady-state working set is
# a few thousand keys — well under 10 MB. 128 MB is roughly ten times the
# headroom needed; approaching it means something is leaking, and the OOM
# errors are the alarm.
maxmemory-policy noeviction

# --- persistence -------------------------------------------------------------
# RDB, not AOF. The suspension denylist and slot locks should survive a
# restart; the OTPs have five-minute TTLs and losing them costs a re-send, not
# a breach. AOF's write amplification is not worth it on an NVMe shared with
# Postgres's WAL.
save 300 10
save 60 1000
appendonly no
dbfilename dump.rdb
dir /data
# If a snapshot fails, stop accepting writes. Silently continuing means the
# restart that follows loses the denylist without anyone knowing.
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

# --- misc --------------------------------------------------------------------
databases 2
tcp-keepalive 60
timeout 0
lazyfree-lazy-expire yes
lazyfree-lazy-eviction yes
notify-keyspace-events ""

# The three commands that turn a Redis foothold into a full host compromise.
# CONFIG SET dir + dbfilename is the classic write-an-SSH-key primitive.
rename-command CONFIG ""
rename-command DEBUG ""
rename-command MODULE ""
