# VersaLife — one 4 GB VPS.
#
# =============================================================================
# THIS FILE NEVER BUILDS ANYTHING
# =============================================================================
# There is no `build:` key here and adding one is a mistake: an SDK build on a
# 3.5 GB box competes with Postgres for memory. telemed-api's release workflow
# builds the image and pushes it to GHCR. `pull_policy: always` is what makes
# `docker compose up -d` on a :latest tag actually fetch a new digest.
#
# =============================================================================
# NOTHING IS PUBLISHED
# =============================================================================
# There is not one `ports:` key in this file. The only inbound path is the
# Cloudflare tunnel, which cloudflared establishes OUTBOUND. This is not
# decoration: Docker's port publishing inserts its own iptables chain that is
# consulted BEFORE the rules ufw and firewalld write, so `-p 5432:5432` on a
# VPS exposes Postgres to the internet while `ufw status` truthfully reports
# the port as denied.
#
# To get a shell, go through the container, not a port:
#   docker compose exec postgres psql -U postgres telemed_api

name: versalife

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

networks:
  # cloudflared <-> telemed-api. Has egress, because the API must reach
  # PayHere, SMTP, Dialog and Cloudflare TURN.
  edge:
    driver: bridge
  # The database. internal:true gives it no default route out at all.
  data:
    driver: bridge
    internal: true

volumes:
  # Bind mounts onto the two attached volumes. Named volumes on the root disk
  # would silently fill the system disk instead.
  pgdata:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${DATA_VOLUME:-/mnt/data}/postgres"
  objects:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${OBJECTS_VOLUME:-/mnt/files/api-files}"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    <<: *logging
    networks: [data]
    mem_limit: 768m
    mem_reservation: 512m
    cpus: 1.5
    # Postgres uses /dev/shm for parallel query tuples. Docker's 64 MB default
    # produces "could not resize shared memory segment" errors that read like
    # disk failure.
    shm_size: 128m
    environment:
      POSTGRES_DB: telemed
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      PGDATA: /var/lib/postgresql/data/pgdata
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres -q"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # One-shot: the telemed_api role and database. restart:"no" -- with
  # `unless-stopped` a container that exits 0 is restarted forever and Compose
  # never observes "completed successfully".
  db-init:
    image: postgres:17-alpine
    restart: "no"
    networks: [data]
    mem_limit: 128m
    <<: *logging
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - ./postgres/init:/init:ro
    entrypoint:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -h
      - postgres
      - -U
      - postgres
      - -d
      - postgres
      - -v
      - api_password=${TELEMED_API_DB_PASSWORD:?TELEMED_API_DB_PASSWORD is required}
      - -f
      - /init/01-telemed-api.sql

  telemed-api:
    image: ghcr.io/versalife26/telemed-api:latest
    pull_policy: always
    container_name: telemed-api
    restart: unless-stopped
    <<: *logging
    networks: [edge, data]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 768m
    mem_reservation: 384m
    cpus: 1.5
    stop_grace_period: 30s
    env_file: [./env/common.env, ./secrets/secrets.env]
    environment:
      # Here rather than in secrets.env: the connection string contains `;`,
      # which breaks any shell that sources an env file.
      Database__ConnectionString: "Host=postgres;Port=5432;Database=telemed_api;Username=telemed_api;Password=${TELEMED_API_DB_PASSWORD:?};GSS Encryption Mode=Disable"
    volumes:
      - objects:/var/lib/telemed/files
    depends_on:
      postgres: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \" 200 \" <&3'"]
      interval: 15s
      timeout: 5s
      retries: 5
      # EF migrations run before the API starts serving.
      start_period: 90s

  cloudflared:
    image: cloudflare/cloudflared:latest
    pull_policy: always
    restart: unless-stopped
    <<: *logging
    # `edge` only. cloudflared must never be able to reach Postgres: it is the
    # one container with an inbound path from the internet.
    networks: [edge]
    mem_limit: 128m
    mem_reservation: 64m
    cpus: 0.5
    user: "65532:65532"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run"]
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./secrets/tunnel-credentials.json:/etc/cloudflared/credentials.json:ro
    depends_on:
      telemed-api: { condition: service_healthy }
