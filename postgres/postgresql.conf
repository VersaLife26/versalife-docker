# Postgres 17 on a 4 GB / 2 vCPU VPS, inside a 768 MB container limit.
#
# The numbers below are derived from that limit, not from host RAM. The usual
# "shared_buffers = 25% of RAM" advice assumes the database owns the machine;
# here it shares 4 GB with three Go processes, Redis, NATS and cloudflared.

listen_addresses = '*'
port = 5432

# --- connections -------------------------------------------------------------
#
# The application opens ONE pgx pool per domain, each capped at
# DB_MAX_CONNS_PER_DOMAIN. At the shipped value of 4 that is:
#
#   telemed-backend       6 domains x 4 = 24
#   telemed-video         1 domain  x 4 =  4
#   telemed-notification  1 domain  x 4 =  4
#                                     ---
#                                        32 peak, 8 idle (MinConns is 1)
#
# Plus the migrate one-shot, a pg_dump, and a human with psql. 50 covers that
# with margin. Raising DB_MAX_CONNS_PER_DOMAIN without raising this is how the
# platform starts refusing connections under load.
#
# Note DATABASE_MAX_CONNS / DATABASE_MIN_CONNS are NOT the knob: they are
# parsed into config.Base and read by nothing.
max_connections = 50
superuser_reserved_connections = 3

# --- memory ------------------------------------------------------------------
shared_buffers = 256MB

# The honest number, not 75% of host RAM. Once every mem_limit in the compose
# file is committed there is roughly 600 MB of page cache actually available.
# Telling the planner it has 3 GB makes it prefer index scans that then go to
# disk, which is slower than the sequential scan it rejected.
effective_cache_size = 768MB

# Per sort or hash NODE, not per query or per connection. 50 connections x a
# couple of nodes x 4 MB is the worst case, and it is deliberately affordable.
work_mem = 4MB
maintenance_work_mem = 64MB
autovacuum_work_mem = 32MB
temp_buffers = 8MB

# --- parallelism -------------------------------------------------------------
# Two cores. Parallel query mostly buys context switches at this size; leave
# the workers available for the admin analytics refresh and keep OLTP serial.
max_worker_processes = 4
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
max_parallel_maintenance_workers = 1
parallel_setup_cost = 2000
min_parallel_table_scan_size = 32MB

# --- WAL and checkpoints -----------------------------------------------------
wal_level = replica
wal_buffers = 16MB
wal_compression = zstd
min_wal_size = 256MB
# 2 GB of a 10 GB volume. Larger means fewer checkpoints; much larger risks the
# volume filling, which stops the database rather than slowing it.
max_wal_size = 2GB
checkpoint_timeout = 15min
# Spread the flush across the interval. A 2-vCPU box cannot absorb a
# checkpoint spike without every query queuing behind it.
checkpoint_completion_target = 0.9
checkpoint_warning = 30s

# This database holds medical records. synchronous_commit = off trades
# durability for throughput and is not a trade available here.
synchronous_commit = on
full_page_writes = on

# --- planner (NVMe) ----------------------------------------------------------
random_page_cost = 1.1
seq_page_cost = 1.0
effective_io_concurrency = 200
maintenance_io_concurrency = 200

# --- autovacuum --------------------------------------------------------------
# Each of the eight schemas has an outbox_events table, which is a queue:
# insert, mark published, delete. At the default scale factors those bloat
# steadily and the relay's SELECT ... FOR UPDATE SKIP LOCKED gets slower with
# them.
autovacuum = on
autovacuum_max_workers = 2
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 400

# --- timeouts ----------------------------------------------------------------
# Shorter than the gateway's REQUEST_TIMEOUT (65s) so Postgres gives up first
# and the error names the query rather than the proxy.
statement_timeout = 30s
lock_timeout = 10s
idle_in_transaction_session_timeout = 60s
tcp_keepalives_idle = 60

# --- logging -----------------------------------------------------------------
log_destination = 'stderr'
# Docker's json-file driver already rotates. A collector inside the container
# would write to a volume nobody rotates.
logging_collector = off
log_min_duration_statement = 500ms
log_checkpoints = on
log_lock_waits = on
log_autovacuum_min_duration = 1000
log_line_prefix = '%m [%p] %q%u@%d '

# UTC here while the application runs TIMEZONE=Asia/Colombo, deliberately. The
# application converts for display; a non-UTC server timezone makes every
# timestamptz comparison something you have to think twice about.
log_timezone = 'UTC'
timezone = 'UTC'

# --- extensions --------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 500
pg_stat_statements.track = top
