# NATS with JetStream, inside a 256 MB container limit.

server_name: versalife-nats
listen: 0.0.0.0:4222

# Monitoring, for the container healthcheck. On the internal `data` bridge
# only; nothing publishes it to the host.
http: 0.0.0.0:8222

jetstream {
  store_dir: "/data/jetstream"

  # 4 GB ceiling on a 10 GB volume shared with Postgres and Redis.
  #
  # NATS_MAX_BYTES on the three services must stay comfortably UNDER this and
  # must be IDENTICAL in all three. events.NewNATS creates the TELEMED stream
  # with MaxBytes on every boot, last writer wins, and JetStream refuses
  # stream creation outright when MaxBytes exceeds max_file_store — which took
  # down every publishing service at once the last time the two disagreed.
  max_file_store: 4GB

  # The stream is created with FileStorage unconditionally, so this is only
  # scratch space for consumer state.
  max_memory_store: 64MB

  sync_interval: 30s
}

# Domain events are small JSON envelopes. 1 MB is already far more than any of
# them needs, and a smaller cap is one less thing to debug.
max_payload: 1MB
max_connections: 64
max_control_line: 4KB
write_deadline: "10s"

authorization {
  user: telemed
  # From the environment, never in this file.
  password: $NATS_PASSWORD
}

debug: false
trace: false
# Docker's json-file driver timestamps every line already.
logtime: false
